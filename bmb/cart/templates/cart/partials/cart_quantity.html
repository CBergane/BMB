<div class="quantity">
    <button type="button" class="icon-button" onclick="updateCartItem('{{ item.cart_key }}', 'decrement')" aria-label="Minska antal">
        -
    </button>
    <span id="quantity-{{ item.cart_key }}">{{ item.quantity }}</span><span> {{ item.produkt.get_unit_display }}</span>
    <button type="button" class="icon-button" onclick="updateCartItem('{{ item.cart_key }}', 'increment')" aria-label="Öka antal">
        +
    </button>
</div>
