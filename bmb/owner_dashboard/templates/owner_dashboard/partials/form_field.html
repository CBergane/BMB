<div class="{% if field.field.widget.input_type == 'checkbox' %}rounded-2xl border border-gray-200 bg-gray-50 p-4{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
        <div class="flex items-start gap-3">
            {{ field }}
            <div>
                <label for="{{ field.id_for_label }}" class="text-sm font-semibold text-gray-900">{{ field.label }}</label>
                {% if field.help_text %}<p class="mt-1 text-xs leading-5 text-gray-600">{{ field.help_text }}</p>{% endif %}
            </div>
        </div>
    {% else %}
        <label for="{{ field.id_for_label }}" class="text-sm font-semibold text-gray-900">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<p class="mt-2 text-xs leading-5 text-gray-600">{{ field.help_text }}</p>{% endif %}
    {% endif %}
    {% for error in field.errors %}
        <p class="mt-2 text-sm font-semibold text-gray-900" role="alert">{{ error }}</p>
    {% endfor %}
</div>
