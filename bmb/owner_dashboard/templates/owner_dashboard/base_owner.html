{% extends 'core/base.html' %}

{% block meta %}
    <meta name="robots" content="noindex, nofollow">
{% endblock %}

{% block content %}
<section class="mx-auto w-full max-w-7xl px-6 py-8 xl:px-0 lg:py-12">
    {% include 'owner_dashboard/partials/owner_navigation.html' %}

    {% if messages %}
        <div class="mt-6 space-y-3" aria-live="polite">
            {% for message in messages %}
                <div class="rounded-2xl border border-gray-300 bg-white px-5 py-4 text-sm font-semibold text-gray-900 shadow-sm" role="status">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block owner_content %}{% endblock %}
</section>
{% endblock %}
